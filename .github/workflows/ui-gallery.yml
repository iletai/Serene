name: UI Gallery

on:
  push:
    branches: ['feat/**']
  pull_request:
    paths:
      - 'App/**'
      - 'Packages/**'
      - 'project.yml'
      - 'Tests/UITests/**'
      - 'scripts/ui-gallery/**'
      - '.github/workflows/ui-gallery.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ui-gallery-${{ github.ref }}
  cancel-in-progress: true

env:
  SIMULATOR: iPhone 16 Pro
  RESULT_BUNDLE: ${{ github.workspace }}/build/ui-gallery.xcresult
  GALLERY_DIR: ${{ github.workspace }}/build/ui-gallery

jobs:
  gallery:
    name: Build UI gallery
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Tooling
        run: |
          which xcodegen || brew install xcodegen
          which xcbeautify || brew install xcbeautify

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: SPM Dependency Cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', 'project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Boot simulator
        run: |
          # Exact name first; fall back to any iPhone if this Xcode ships different models.
          udid=$(xcrun simctl list devices available -j | python3 -I -c '
          import json, os, sys
          devices = [d for ds in json.load(sys.stdin)["devices"].values() for d in ds]
          exact = [d for d in devices if d["name"] == os.environ["SIMULATOR"]]
          print((exact or [d for d in devices if d["name"].startswith("iPhone")])[0]["udid"])
          ')
          echo "Using simulator $udid"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

      - name: Run UIGalleryTests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme AnNien-Dev \
            -configuration Debug-Development \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -only-testing:AnNienUITests/UIGalleryTests \
            -resultBundlePath "$RESULT_BUNDLE" \
            2>&1 | xcbeautify --renderer github-actions

      - name: Build gallery
        if: always()
        run: |
          if [ -d "$RESULT_BUNDLE" ]; then
            scripts/ui-gallery/build-gallery.sh "$RESULT_BUNDLE" "$GALLERY_DIR"
          fi

      - name: Upload gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-gallery
          path: ${{ env.GALLERY_DIR }}
          if-no-files-found: warn

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-gallery-xcresult
          path: ${{ env.RESULT_BUNDLE }}
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "## UI gallery"
            echo "Artifact **ui-gallery** (open \`index.html\`) on [this run]($run_url#artifacts)."
            echo
            cat "$GALLERY_DIR/summary.md" 2>/dev/null || echo "No screenshots were produced."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sticky PR comment
        if: always() && github.event_name == 'pull_request'
        # Fork PRs get a read-only token; a missing comment must not fail the gallery job.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ui-gallery -->';
            const summaryPath = `${process.env.GALLERY_DIR}/summary.md`;
            const summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8')
              : 'No screenshots were produced.';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n### UI gallery\nDownload artifact **ui-gallery** from [this run](${runUrl}#artifacts) and open \`index.html\`.\n\n${summary}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
