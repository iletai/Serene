name: Deploy - TestFlight Beta

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  gate:
    uses: iletai/ios-shared/.github/workflows/ios-ci.yml@main
    with:
      xcconfig-secrets: MICROCMS_API_KEY
    secrets: inherit
  beta:
    needs: gate
    uses: iletai/ios-shared/.github/workflows/ios-testflight.yml@main
    with:
      # Config/Secrets.xcconfig (gitignored), read by Shared.xcconfig -> App/Info.plist
      xcconfig-secrets: MICROCMS_API_KEY
    secrets: inherit
