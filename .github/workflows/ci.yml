name: CI - PR & Build Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, main, 'feat/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: iletai/ios-shared/.github/workflows/ios-ci.yml@main
    with:
      xcconfig-secrets: MICROCMS_API_KEY
    secrets: inherit
