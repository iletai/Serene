name: Deploy - App Store Release

on:
  push:
    tags: ['release-*']
  workflow_dispatch:
    inputs:
      submit:
        description: Submit for review (needs explicit owner OK)
        type: boolean
        default: false
      skip_metadata:
        description: Skip uploading metadata to App Store Connect
        type: boolean
        default: false
      screenshots:
        description: Capture and upload screenshots
        type: boolean
        default: true

jobs:
  gate:
    uses: iletai/ios-shared/.github/workflows/ios-ci.yml@main
    with:
      xcconfig-secrets: MICROCMS_API_KEY
    secrets: inherit
  release:
    needs: gate
    uses: iletai/ios-shared/.github/workflows/ios-appstore.yml@main
    with:
      submit: ${{ inputs.submit == true }}
      skip-metadata: ${{ inputs.skip_metadata == true }}
      # Tag pushes have no inputs; screenshots stay on like the old workflow.
      screenshots: ${{ inputs.screenshots != false }}
      xcconfig-secrets: MICROCMS_API_KEY
    secrets: inherit
