<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <!-- Background Gradient: New Rice Ivory to Woven Linen -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF9F1" />
      <stop offset="50%" stop-color="#FCF6ED" />
      <stop offset="100%" stop-color="#F8F3EB" />
    </linearGradient>

    <!-- Gold Accent Gradient: Imperial Chrysanthemum Gold -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8B56B" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#A57F32" />
    </linearGradient>

    <!-- Red Accent Gradient: Cinnabar Lacquer Red -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9492E" />
      <stop offset="100%" stop-color="#C23B22" />
    </linearGradient>

    <!-- Subtle Radial Glow for Moon & Sun Motif -->
    <radialGradient id="celestialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#C5A059" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadow for Icon and Cards -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1D1C17" flood-opacity="0.08" />
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1D1C17" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Base Canvas: Rounded Rectangle with Ivory-Linen Gradient -->
  <rect width="1200" height="480" rx="28" fill="url(#bgGradient)" stroke="#E8E0D2" stroke-width="1.5" />

  <!-- Background Decorative Watermark Rings (Dong Son / Lunar orbit motif) -->
  <g transform="translate(980, 240)" opacity="0.08" stroke="#1D1C17" fill="none">
    <circle r="340" stroke-width="1" stroke-dasharray="6 8" />
    <circle r="270" stroke-width="1" />
    <circle r="200" stroke-width="1" stroke-dasharray="3 6" />
    <circle r="130" stroke-width="1.5" />
    <circle r="60" stroke-width="1" />
  </g>

  <!-- Left Side: App Icon Motif & Emblem Card -->
  <g transform="translate(140, 100)">
    <!-- Ambient Backdrop Aura -->
    <circle cx="140" cy="140" r="180" fill="url(#celestialGlow)" />

    <!-- App Icon Base Card -->
    <rect x="20" y="20" width="240" height="240" rx="52" fill="#FEF9F1" stroke="#E6DCCF" stroke-width="1.5" filter="url(#softShadow)" />

    <!-- Traditional Inner Border Framing -->
    <rect x="32" y="32" width="216" height="216" rx="42" fill="none" stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.5" />

    <!-- Stylized Calendar Calendar-Header Bar in Cinnabar Red -->
    <path d="M48 64 C48 50.745 58.745 40 72 40 L208 40 C221.255 40 232 50.745 232 64 L232 88 L48 88 Z" fill="url(#redGradient)" />

    <!-- Calendar Rings / Binder Pegs -->
    <circle cx="86" cy="40" r="4.5" fill="#FEF9F1" />
    <circle cx="140" cy="40" r="4.5" fill="#FEF9F1" />
    <circle cx="194" cy="40" r="4.5" fill="#FEF9F1" />

    <!-- Crescent Moon & Solar Core Motif (Âm Dương Lịch) -->
    <g transform="translate(140, 160)">
      <!-- Golden Solar Ray Burst Points -->
      <g stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.4">
        <line x1="0" y1="-50" x2="0" y2="-42" />
        <line x1="35" y1="-35" x2="30" y2="-30" />
        <line x1="50" y1="0" x2="42" y2="0" />
        <line x1="35" y1="35" x2="30" y2="30" />
        <line x1="0" y1="50" x2="0" y2="42" />
        <line x1="-35" y1="35" x2="-30" y2="30" />
        <line x1="-50" y1="0" x2="-42" y2="0" />
        <line x1="-35" y1="-35" x2="-30" y2="-30" />
      </g>

      <!-- Crescent Moon Shape (Âm Lịch) -->
      <path d="M-6 -34 C18 -34 36 -16 36 10 C36 34 18 48 -6 48 C16 42 26 28 26 10 C26 -10 14 -28 -6 -34 Z" fill="url(#goldGradient)" />

      <!-- Center Solar Dot / Memorial Pearl (Dương Lịch & Ngày Nhớ) -->
      <circle cx="-2" cy="7" r="13" fill="url(#redGradient)" />
      <circle cx="-2" cy="7" r="5" fill="#FEF9F1" opacity="0.9" />
    </g>

    <!-- Traditional Seal (Ấn Triện) in Lower Corner -->
    <rect x="186" y="196" width="44" height="44" rx="10" fill="url(#redGradient)" />
    <text x="208" y="224" font-family="'New York', 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#FEF9F1" text-anchor="middle" letter-spacing="1">安</text>
  </g>

  <!-- Right Side: Typography & Metadata -->
  <g transform="translate(480, 130)">
    <!-- Pill Tag: Platform & Identity -->
    <g filter="url(#badgeShadow)">
      <rect x="0" y="0" width="194" height="30" rx="15" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="#C23B22" />
      <text x="28" y="20" font-family="-apple-system, 'SF Pro Text', sans-serif" font-size="11.5" font-weight="600" fill="#59413C" letter-spacing="1.2">SWIFT 6 • CLEAN ARCH</text>
    </g>

    <!-- App Name: AN NIÊN -->
    <text x="0" y="98" font-family="'New York', 'Times New Roman', Georgia, serif" font-size="62" font-weight="700" fill="#1D1C17" letter-spacing="3">AN NIÊN</text>

    <!-- English App Title Inline Callout -->
    <text x="312" y="98" font-family="'New York', 'Times New Roman', Georgia, serif" font-size="34" font-weight="400" font-style="italic" fill="#C5A059" letter-spacing="1.5">Serene</text>

    <!-- Vietnamese Subtitle -->
    <text x="2" y="142" font-family="-apple-system, 'SF Pro Display', sans-serif" font-size="21" font-weight="600" fill="#59413C" letter-spacing="0.5">Lịch Việt &amp; Ngày Nhớ</text>

    <!-- Decorative Gold Divider Line -->
    <path d="M2 166 L460 166" stroke="url(#goldGradient)" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />

    <!-- English Subtitle & Core Capability Pills -->
    <text x="2" y="198" font-family="-apple-system, 'SF Pro Text', sans-serif" font-size="14.5" font-weight="400" fill="#59413C" opacity="0.85" letter-spacing="0.3">Vietnamese Lunar-Solar Engine &amp; Memorial Calendar for iOS</text>

    <!-- Feature Tag Badges -->
    <g transform="translate(2, 224)">
      <!-- Badge 1: Can Chi & Tiết Khí -->
      <rect x="0" y="0" width="144" height="26" rx="6" fill="#F4EEE4" stroke="#E4DCD0" stroke-width="1" />
      <text x="72" y="17.5" font-family="-apple-system, 'SF Pro Text', sans-serif" font-size="11.5" font-weight="500" fill="#1D1C17" text-anchor="middle">Can Chi • 24 Tiết Khí</text>

      <!-- Badge 2: Offline & CloudKit -->
      <rect x="154" y="0" width="138" height="26" rx="6" fill="#F4EEE4" stroke="#E4DCD0" stroke-width="1" />
      <text x="223" y="17.5" font-family="-apple-system, 'SF Pro Text', sans-serif" font-size="11.5" font-weight="500" fill="#1D1C17" text-anchor="middle">Offline-First • CloudKit</text>

      <!-- Badge 3: WidgetKit -->
      <rect x="302" y="0" width="132" height="26" rx="6" fill="#F4EEE4" stroke="#E4DCD0" stroke-width="1" />
      <text x="368" y="17.5" font-family="-apple-system, 'SF Pro Text', sans-serif" font-size="11.5" font-weight="500" fill="#1D1C17" text-anchor="middle">WidgetKit Ready</text>
    </g>
  </g>
</svg>
