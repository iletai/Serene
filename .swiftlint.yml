disabled_rules:
  - trailing_whitespace
  - todo
  - line_length
  - type_body_length
  - trailing_newline

opt_in_rules:
  - empty_count
  - empty_string
  - force_unwrapping
  - fatal_error_message
  - first_where
  - implicitly_unwrapped_optional
  - redundant_type_annotation
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

included:
  - App
  - Extensions
  - Packages/VNCalendarLunar/Sources
  - Packages/VNCalendarDomain/Sources
  - Packages/VNCalendarDesignSystem/Sources
  - Packages/VNCalendarData/Sources
  - Packages/VNCalendarKit/Sources
  - Tests

excluded:
  - .build
  - "**/DerivedData"
  - "**/Packages/*/.build"
  - "**/checkouts"
  - DerivedData
  - Pods
  - fastlane
  - build

identifier_name:
  min_length:
    warning: 1
  excluded:
    - id
    - x
    - y
    - d
    - m
    - q
    - h
    - r
    - jd

file_length:
  warning: 500
  error: 1200

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 10
  error: 20
